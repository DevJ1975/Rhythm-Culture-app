<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/discover"></ion-back-button>
    </ion-buttons>
    <ion-title>#{{ tag }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="flex justify-center py-8" *ngIf="loading">
    <ion-spinner></ion-spinner>
  </div>
  <ng-container *ngIf="!loading">
    <app-post-card *ngFor="let post of posts" [post]="post"></app-post-card>
    <div *ngIf="!posts.length" class="text-center text-gray-500 py-12">
      No posts tagged with #{{ tag }} yet.
    </div>
  </ng-container>
</ion-content>
