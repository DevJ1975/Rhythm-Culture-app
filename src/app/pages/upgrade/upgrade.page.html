<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/feed"></ion-back-button>
    </ion-buttons>
    <ion-title>Upgrade to Pro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="max-w-md mx-auto pt-6">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-gradient-to-br from-yellow-400 to-pink-500 mb-4">
        <ion-icon name="ribbon-outline" class="text-white text-4xl"></ion-icon>
      </div>
      <h1 class="text-2xl font-bold mb-2">Rhythm Culture Pro</h1>
      <p class="text-gray-500">Unlock the full creator toolkit</p>
    </div>

    <ul class="space-y-4 mb-8">
      <li *ngFor="let perk of perks" class="flex items-start">
        <ion-icon [name]="perk.icon" class="text-primary text-xl mr-3 mt-0.5"></ion-icon>
        <span class="flex-1">{{ perk.text }}</span>
        <ion-icon name="checkmark-outline" class="text-green-500 text-xl"></ion-icon>
      </li>
    </ul>

    <ion-button expand="block" size="large" (click)="subscribe()" [disabled]="loading">
      {{ loading ? 'Redirecting...' : 'Subscribe' }}
    </ion-button>

    <p class="text-xs text-gray-400 text-center mt-4">
      Subscription auto-renews. Cancel anytime from your account.
    </p>
  </div>
</ion-content>
